name: release

# On every push to main, semantic-release derives the next version from the
# Conventional Commits since the last tag, creates the tag and GitHub Release,
# and the build matrix attaches the per-platform packages and FFmpeg sources.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --no-install semantic-release
      - name: Detect new version
        id: version
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Released: ${tag:-nothing}"

  build:
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.semantic-release.outputs.version }}

  sources:
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VERSION: ${{ needs.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle FFmpeg/x264 corresponding source (GPL)
        run: scripts/bundle-sources.sh "dist/framework-${VERSION}-ffmpeg-x264-sources.tar.gz"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" "dist/framework-${VERSION}-ffmpeg-x264-sources.tar.gz" --clobber
