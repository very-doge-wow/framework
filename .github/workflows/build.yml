name: build

# Reusable build: lint, test and package Framework on Linux, macOS and Windows.
on:
  workflow_call:
    inputs:
      version:
        description: Release version to stamp into the build and upload to the GitHub Release (empty for CI builds).
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            triplet: x64-linux-dynamic-release
            coverage: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            triplet: arm64-linux-dynamic-release
          - name: macos-arm64
            os: macos-15
            triplet: arm64-osx-dynamic-release
          - name: windows-x86_64
            os: windows-2025
            triplet: x64-windows-release
          - name: windows-arm64
            os: windows-11-arm
            triplet: arm64-windows-release
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-bincache
      FFMPEG_DIR: ${{ github.workspace }}/vcpkg_installed/${{ matrix.triplet }}
      TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm pkg-config clang libclang-dev patchelf \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev

      - name: Ensure rustup
        run: |
          if ! command -v rustup >/dev/null; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              arch=x86_64; [[ "${PROCESSOR_ARCHITECTURE:-}" == "ARM64" ]] && arch=aarch64
              curl -sSfLo rustup-init.exe "https://static.rust-lang.org/rustup/dist/${arch}-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --default-toolchain none --profile minimal
              echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            fi
          fi

      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        run: |
          if [[ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]]; then
            choco install llvm -y --no-progress
          fi
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**') }}

      - name: Build FFmpeg + x264 with vcpkg
        run: scripts/vcpkg-install.sh

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'vcpkg.json') }}

      - name: Stamp release version
        if: inputs.version != ''
        run: scripts/set-version.sh "${{ inputs.version }}"

      - name: Library search path for tests
        run: |
          scripts/ffmpeg-env.sh | grep -v '^PATH=' >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cygpath -w "$FFMPEG_DIR/bin" >> "$GITHUB_PATH"
          fi

      - name: Format
        if: matrix.coverage
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Coverage (>= 95 % lines)
        if: matrix.coverage
        run: |
          cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
          scripts/coverage.sh
        env:
          # renovate: datasource=crate depName=cargo-llvm-cov
          CARGO_LLVM_COV_VERSION: "0.9.2"

      - name: License and dependency policy
        if: matrix.coverage
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo deny --log-level error check licenses bans sources
        env:
          # renovate: datasource=crate depName=cargo-deny
          CARGO_DENY_VERSION: "0.22.1"

      - name: Build release binaries
        run: cargo build --locked --release --bin framework --bin framework-cli

      - name: Package
        id: package
        run: scripts/package.sh "${{ matrix.name }}" "${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}"

      - name: Smoke-test package
        run: scripts/smoke-test.sh "${{ steps.package.outputs.dir }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ inputs.version }}" "${{ steps.package.outputs.archive }}" --clobber
