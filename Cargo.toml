[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/very-doge-wow/framework"
rust-version = "1.99"

[workspace.dependencies]
framework-core = { path = "crates/framework-core" }
framework-media = { path = "crates/framework-media" }
anyhow = "=1.0.105"
clap = { version = "=4.6.10", features = ["derive"] }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "wayland", "wgpu", "x11"] }
egui = "=0.37.0"
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "filter", "software-resampling", "software-scaling"] }
rfd = "=0.18.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }
zip = { version = "=9.8.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
