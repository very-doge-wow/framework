# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Every crate we ship must be compatible with GPL-3.0-or-later.

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    # FSF: GPL-compatible. Used by the ffmpeg-next / ffmpeg-sys-next bindings.
    "WTFPL",
    "Zlib",
]

# egui's built-in fonts are font data (not code) embedded in the binary.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
